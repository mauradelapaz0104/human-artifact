<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to My Space</title>
  
  <!-- GOOGLE FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* STYLING & COLOR SCHEME - NUDE / BEIGE AESTHETIC */
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f7f4ef; /* Soft warm cream background */
      color: #3e3835; /* Dark neutral text */
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      line-height: 1.6;
    }

    /* MAIN CONTAINER CARD */
    .container {
      background-color: #ffffff;
      width: 90%;
      max-width: 600px;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.03);
      text-align: center;
      border: 2px solid #e0d8cd; /* Warm nude border */
      border-left: 8px solid #c2a68c; /* Soft sand accent line */
      box-sizing: border-box;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      color: #7c5c43; /* Deep terracotta/warm taupe */
      font-size: 2.5rem;
      margin-top: 0;
      margin-bottom: 15px;
    }

    p {
      font-size: 1.05rem;
      color: #5a524c;
      margin-bottom: 15px;
    }

    strong {
      color: #7c5c43;
    }

    /* DIRECTORY BUTTON */
    .btn {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #c2a68c;
      color: #ffffff;
      padding: 14px 28px;
      font-size: 1rem;
      border-radius: 25px;
      text-decoration: none;
      font-weight: 600;
      display: inline-block;
      margin-top: 15px;
      transition: transform 0.2s, background-color 0.2s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .btn:hover {
      background-color: #a87c5d;
      transform: scale(1.03);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Welcome to My Space</h1>
    <p>Hello! My name is <strong>Maura De la Paz</strong>.</p>
    <p>This web page is now live. My digital <strong>human artifact</strong> project will be living here on this site.</p>
    
    <!-- BUTTON DIRECTING TO YOUR NEW INFOGRAPHIC PAGE -->
    <a href="infographic.html" class="btn">✨ View My Infographic ✨</a>
  </div>

</body>
</html>
